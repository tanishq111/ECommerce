<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: html(~{::#content}, ~{::#head-content})}">
<head>
    <th:block id="head-content">
        <title>Login - E-Shop</title>
    </th:block>
</head>
<body>
    <main id="content">
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-lg-5 col-md-7">
                    <div class="card shadow border-0 rounded-lg">
                        <div class="card-header bg-primary text-white text-center py-4">
                            <h3 class="mb-0">
                                <i class="bi bi-box-arrow-in-right"></i> Welcome Back
                            </h3>
                            <p class="mb-0">Sign in to your account</p>
                        </div>
                        
                        <div class="card-body p-5">
                            <!-- Login Form -->
                            <form th:action="@{/login}" method="post">
                                <div class="form-floating mb-3">
                                    <input type="email" class="form-control" id="username" name="username" 
                                           placeholder="name@example.com" required>
                                    <label for="username">
                                        <i class="bi bi-envelope"></i> Email Address
                                    </label>
                                </div>
                                
                                <div class="form-floating mb-3">
                                    <input type="password" class="form-control" id="password" name="password" 
                                           placeholder="Password" required>
                                    <label for="password">
                                        <i class="bi bi-lock"></i> Password
                                    </label>
                                </div>
                                
                                <div class="form-check mb-4">
                                    <input class="form-check-input" type="checkbox" value="remember-me" 
                                           id="rememberMe" name="remember-me">
                                    <label class="form-check-label" for="rememberMe">
                                        Remember me on this device
                                    </label>
                                </div>
                                
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary btn-lg">
                                        <i class="bi bi-box-arrow-in-right"></i> Sign In
                                    </button>
                                </div>
                            </form>
                            
                            <!-- Demo Credentials -->
                            <div class="mt-4 p-3 bg-light rounded">
                                <h6 class="text-muted mb-2">Demo Credentials:</h6>
                                <small class="text-muted d-block">Admin: admin@admin.com / admin123</small>
                                <small class="text-muted d-block">Customer: user@user.com / user123</small>
                            </div>
                        </div>
                        
                        <div class="card-footer text-center py-3">
                            <div class="small">
                                <a th:href="@{/forgot-password}" class="text-decoration-none">
                                    <i class="bi bi-question-circle"></i> Forgot Password?
                                </a>
                            </div>
                            <div class="small mt-2">
                                Don't have an account? 
                                <a th:href="@{/register}" class="text-decoration-none">
                                    <i class="bi bi-person-plus"></i> Create Account
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
